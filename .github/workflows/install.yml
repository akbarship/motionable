# The one-line installer on each system a customer may have: it installs (Node, ffmpeg, packages, the Studio build)
# without admin rights, the tests pass, and the server starts and answers.
name: install
on: [push, workflow_dispatch]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOTIONABLE_REPO: ${{ github.workspace }}
      MOTIONABLE_SKIP_CLAUDE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: install (macOS, Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh < /dev/null
      - name: install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1
      - name: ffmpeg from the installer's own download
        shell: bash
        run: cd ~/.motionable/app && node scripts/setup.mjs --ffmpeg && ls ~/.motionable/bin
      - name: tests
        shell: bash
        run: cd ~/.motionable/app && npm test
      - name: the server starts and answers
        shell: bash
        run: |
          cd ~/.motionable/app
          node scripts/mcp.mjs < /dev/null || true
          node node_modules/tsx/dist/cli.mjs apps/daemon/src/boot.ts &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4377/api/health && exit 0; sleep 1; done
          exit 1
